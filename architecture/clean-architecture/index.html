class OrderController(private val jdbc: JdbcTemplate) {

  @PostMapping("/orders")
  fun place(@RequestBody req: Map<String, Any>): Map<String, Any> {
    val price = req["price"] as Int                        // 웹 입출력
    var total = price                                      // 업무 규칙
    if (req["coupon"] == "WELCOME") total = price * 90 / 100
    if (total < 0) throw IllegalStateException("금액이 음수")

    val paid = RestTemplate()                              // 외부 연동
      .postForObject("https://api.toss.im/pay", total, String::class.java)

    jdbc.update("INSERT INTO orders(price,total) VALUES(?,?)", price, total)
    return mapOf("total" to total, "paid" to paid)         // 저장
  }
}`},"layer:ctl":{file:"web/OrderController.kt",note:"웹만 담당한다. 여기까지는 잘 나뉘었다. 다만 이 파일은 Spring MVC 를 알고 있어서, 테스트하려면 웹 환경이 필요하다.",code:`@RestController
class OrderController(private val service: OrderService) {

  @PostMapping("/orders")
  fun place(@RequestBody req: OrderRequest): OrderResponse {
    val order = service.place(req.price, req.coupon)
    return OrderResponse(order.id, order.total)
  }
}`},"layer:svc":{file:"service/OrderService.kt",note:"업무 규칙이 여기 모였다. 그런데 아래 두 줄을 보라 — 이 파일은 `OrderRepository`(DB 를 쓰는 클래스)와 `PaymentClient`(토스를 부르는 클래스)를 **직접 안다.** 그래서 DB 를 바꾸면 이 파일이 딸려 부서지고, 테스트하려면 DB 가 떠 있어야 한다.",code:`@Service
class OrderService(
  private val repository: OrderRepository,   // ← DB 를 쓰는 구현 클래스
  private val payment: PaymentClient,        // ← 토스를 부르는 구현 클래스
) {
  fun place(price: Int, coupon: String?): Order {
    var total = price
    if (coupon == "WELCOME") total = price * 90 / 100
    check(total >= 0) { "금액이 음수" }

    payment.pay(total)
