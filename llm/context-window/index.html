iku 4.5 = 4096.","- 툴 정의: GitHub·Slack·Sentry·Grafana·Splunk 5개 = ~55k 토큰(일 시작 전에). 툴 검색(defer_loading)이","  85% 이상 줄이고 실제로 쓰는 건 3~5개. 툴이 30~50개를 넘으면 선택 정확도 자체가 떨어진다.","  defer_loading 은 컨텍스트에 올라가는 것을 바꾸는 것이지 요청에 보내는 것을 바꾸지 않는다 — 전부 보낸다.","  발견된 툴은 tool_reference 로 대화 안쪽에 덧붙어서 접두사를 안 건드리고 캐시가 보존된다.","  최소 하나는 defer_loading=false 여야 한다(400).","- compaction: 서버사이드, 기본 trigger 입력 150,000(최소 50,000), 베타 compact-2026-01-12.","  응답의 compaction 블록을 반드시 이력에 붙여야 하고(response.content 통째로), API 는 다음 요청에서","  그 블록 이전을 무시한다. pause_after_compaction 으로 직접 보존할 수 있다.","- context editing: clear_tool_uses_20250919, trigger 기본 100,000 입력 토큰, keep 기본 최근 3개 tool_uses,",'  지운 자리에 "[Tool result cleared by context management]" 가 남는다. clear_at_least 로 캐시 무효화 값어치의 하한을 둔다.','- 위치 효과: Liu et al. "Lost in the Middle"(TACL, 2023) — 앞이나 끝에 있을 때 성능이 가장 높고',"  가운데에 있으면 크게 떨어진다. 단 실험 대상이 2023년 모델이므로 곡선의 모양만 근거로 쓴다.","- context rot: Anthropic — 토큰이 늘수록 정확한 회수 능력이 떨어지고 모든 모델에서 나타난다.","  원인은 attention budget: 트랜스포머는 n 토큰이면 n² 쌍관계라 길어지면 얇게 늘어난다.","- 서브에이전트: 깨끗한 컨텍스트로 넓게 탐색하고 보통 1,000~2,000 토큰짜리 요약만 부모에게 돌려준다.","  상세한 탐색 맥락은 서브에이전트 안에 격리된다 — 그게 이득이자 대가다.","- context awareness: Sonnet 5/4.6/4.5·Haiku 4.5 는 API 가 <budget:token_budget> 와","  <system_warning> 태그를 주입해 남은 예산을 알려준다. Opus 4.7 이후 Opus·Fable 5·Mythos 5 는 받지 않는다.","- 사고 블록 잔존은 모델마다 다르다: Opus 4.5 이후 Opus, Sonnet 4.6 이후 Sonnet, Fable/Mythos 5 는 기본 유지.","  그 이전과 모든 Haiku 는 자동으로 떼어낸다. 단 툴 사용 사이클 안에서는 서명까지 그대로 돌려줘야 한다.","","결과 지표 넷: 작업 성공률 · 잊은 지시 · 실효 비용(정가 대비 배수) · 예산 사용률.","손잡이는 장마다 다릅니다 — 그 장에서 쓸 것만 화면에 나옵니다.","스테이지: "+ye.map((D,lt)=>`${lt+1}) ${D.title}`).join("  "),"","시뮬레이터는 모델이라 실제와 다른 단순화가 있습니다 — 물어보면 솔직히 알려주세요:","- 시스템 프롬프트 2,400 · 스킬 1,800 · 기본 툴 3,200 같은 값은 예시 값입니다.","  코딩 에이전트의 실제 구성비는 공개된 1차 수치가 없습니다.","- 회수 확률 = 상태 × 위치 × 길이 는 교보재용 모형이고 숫자에는 근거가 없습니다.","  근거가 있는 것은 모양 둘뿐입니다: 가운데가 약한 U자(Liu et al.)와 길수록 떨어진다(context rot).",'- 압축이 사실을 60% 확률로 살린다는 것도 모형입니다. 공식 문서는 "미묘하지만 결정적인 맥락을','  잃을 수 있다" 고만 밝히고 정량을 주지 않습니다.',"- 실제 compaction 은 최근 N턴을 자동
